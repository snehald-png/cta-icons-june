<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>June Sheet — CTA/Icon Review Dashboard</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --border: #e3e6eb;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #76b900;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.04);
    --confirmed-bg: #e6f4d7;
    --confirmed-text: #3f6b00;
    --suggested-bg: #fff4d6;
    --suggested-text: #8a5a00;
    --blank-bg: #ececec;
    --blank-text: #555;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  header {
    max-width: 1400px;
    margin: 0 auto 20px auto;
  }
  h1 {
    margin: 0 0 8px 0;
    font-size: 22px;
    font-weight: 600;
  }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .legend .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 500;
  }
  .legend .chip.confirmed { background: var(--confirmed-bg); color: var(--confirmed-text); }
  .legend .chip.suggested { background: var(--suggested-bg); color: var(--suggested-text); }
  .legend .chip.blank     { background: var(--blank-bg);     color: var(--blank-text); }

  main {
    max-width: 1400px;
    margin: 0 auto;
  }
  .priority-section {
    margin-bottom: 26px;
  }
  .priority-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
  }
  .priority-header h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
  }
  .priority-header .sub {
    font-size: 12px;
    color: var(--muted);
  }
  .row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }
  @media (max-width: 900px) {
    .row { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 220px;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: none;
  }
  .badge.confirmed { background: var(--confirmed-bg); color: var(--confirmed-text); }
  .badge.suggested { background: var(--suggested-bg); color: var(--suggested-text); }
  .badge.blank     { background: var(--blank-bg);     color: var(--blank-text); }

  .card-body {
    display: flex;
    gap: 12px;
    align-items: flex-start;
  }
  .icon-wrap {
    flex: 0 0 96px;
    width: 96px;
    text-align: center;
  }
  .icon-wrap img {
    width: 96px;
    height: auto;
    border-radius: 6px;
    background: #fafafa;
    border: 1px solid var(--border);
    object-fit: contain;
    display: block;
  }
  .icon-fallback {
    width: 96px;
    height: 96px;
    border: 1px dashed #c8c8c8;
    border-radius: 6px;
    display: none;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 11px;
    text-align: center;
    padding: 4px;
    background: #fafafa;
    box-sizing: border-box;
    line-height: 1.3;
  }
  .icon-fallback.pending {
    border-color: #e0c270;
    background: #fffaf0;
    color: #8a5a00;
  }
  .reco {
    margin-top: 10px;
    padding: 10px;
    border-top: 1px dashed #d0d7e0;
    background: #f5faef;
    border-radius: 6px;
    font-size: 12px;
    color: #2d3748;
  }
  .reco-head {
    font-weight: 700;
    color: #4a7d00;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    font-size: 10.5px;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .reco-conf {
    font-size: 9.5px;
    padding: 1px 6px;
    border-radius: 999px;
    font-weight: 700;
    letter-spacing: 0.02em;
  }
  .reco-conf.high   { background: #cfe9a8; color: #3f6b00; }
  .reco-conf.medium { background: #fff0b8; color: #8a5a00; }
  .reco-conf.low    { background: #f7d1d1; color: #8a2c2c; }
  .reco-file {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11px;
    color: #1f2328;
    word-break: break-all;
    margin: 2px 0 4px 0;
  }
  .reco-why {
    color: #4a5568;
    font-size: 11.5px;
    line-height: 1.4;
  }
  .icon-file {
    margin-top: 6px;
    font-size: 10.5px;
    color: var(--muted);
    word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .card-content {
    flex: 1;
    min-width: 0;
  }
  .card-title {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 4px 0;
    color: var(--text);
  }
  .card-snippet {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 8px 0;
  }
  .card-link {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
    display: inline-block;
    transition: background 0.15s ease;
  }
  .card-link:hover {
    background: var(--accent);
    color: #fff;
  }
  .card-link.disabled {
    color: #aaa;
    border-color: #ddd;
    pointer-events: none;
  }
  .url-fallback {
    font-size: 10px;
    color: var(--muted);
    word-break: break-all;
    margin-top: 6px;
    display: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
</style>

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// These icon filenames return 302 → /?mktfail on NVIDIA's Marketo CDN
// (asset not yet uploaded). Render a clean placeholder instead of attempting
// the broken request.
const MISSING_FROM_CDN = new Set([]);

function renderCard(priority, cta) {
  const statusKey = (cta.status || "Blank").toLowerCase();
  const hasIcon = !!cta.icon_url;
  const hasLink = !!cta.link;
  const iconPending = hasIcon && MISSING_FROM_CDN.has(cta.icon_file);

  let iconBlock;
  if (!hasIcon) {
    iconBlock = `<div class="icon-fallback" style="display:flex;">No icon</div>`;
  } else if (iconPending) {
    iconBlock = `
      <div class="icon-fallback pending" style="display:flex;">Icon pending<br/>on CDN</div>
      <div class="url-fallback" style="display:block;">${escapeHtml(cta.icon_url)}</div>
    `;
  } else {
    iconBlock = `
      <img src="${escapeHtml(cta.icon_url)}" alt="${escapeHtml(cta.icon_file)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'; const u=this.parentElement.querySelector('.url-fallback'); if(u) u.style.display='block';" />
      <div class="icon-fallback">Image failed to load</div>
      <div class="url-fallback">${escapeHtml(cta.icon_url)}</div>
    `;
  }

  return `
    <div class="card">
      <div class="card-top">
        <span>${escapeHtml(priority)} · ${escapeHtml(cta.label)}</span>
        <span class="badge ${statusKey}">${escapeHtml(cta.status || "Blank")}</span>
      </div>
      <div class="card-body">
        <div class="icon-wrap">
          ${iconBlock}
          <div class="icon-file">${escapeHtml(cta.icon_file || "—")}</div>
        </div>
        <div class="card-content">
          <h3 class="card-title">${escapeHtml(cta.title)}</h3>
          <p class="card-snippet">${escapeHtml(cta.snippet)}</p>
          ${hasLink
            ? `<a class="card-link" href="${escapeHtml(cta.link)}" target="_blank" rel="noopener noreferrer">Open CTA →</a>`
            : `<span class="card-link disabled">No link</span>`}
        </div>
      </div>
      ${cta.reco ? `
        <div class="reco">
          <div class="reco-head">
            <span>Recommended icon swap</span>
            <span class="reco-conf ${escapeHtml(cta.reco.conf)}">${escapeHtml(cta.reco.conf)} confidence</span>
          </div>
          <div class="reco-file">${escapeHtml(cta.reco.file)}</div>
          <div class="reco-why">${escapeHtml(cta.reco.why)}</div>
        </div>
      ` : ``}
    </div>
  `;
}

function renderSection(section) {
  const cards = section.ctas.map(c => renderCard(section.priority, c)).join("");
  return `
    <section class="priority-section">
      <div class="priority-header">
        <h2>${escapeHtml(section.priority)}</h2>
        <span class="sub">CTA 1 · CTA 2 · CTA 3</span>
      </div>
      <div class="row">${cards}</div>
    </section>
  `;
}

document.getElementById("dashboard").innerHTML = DATA.map(renderSection).join("");
