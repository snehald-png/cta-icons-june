<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TRAIL Kits : Industry CTA and icon mapping</title>
<style>
  :root {
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --border: #e3e6eb;
    --text: #1f2328;
    --muted: #6b7280;
    --accent: #76b900;
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 2px 6px rgba(0,0,0,0.04);
    --confirmed-bg: #e6f4d7;
    --confirmed-text: #3f6b00;
    --suggested-bg: #fff4d6;
    --suggested-text: #8a5a00;
    --blank-bg: #ececec;
    --blank-text: #555;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.45;
  }
  header {
    max-width: 1400px;
    margin: 0 auto 20px auto;
  }
  h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 8px;
  }
  .download-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.15s ease, transform 0.05s ease;
    white-space: nowrap;
  }
  .download-btn:hover { background: #5e9300; border-color: #5e9300; }
  .download-btn:active { transform: translateY(1px); }
  .download-group { display: inline-flex; gap: 8px; }
  .download-btn-alt {
    background: #fff;
    color: var(--accent);
  }
  .download-btn-alt:hover { background: #f3faec; border-color: var(--accent); color: var(--accent); }
  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .legend .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 10px;
    border-radius: 999px;
    font-weight: 500;
  }
  .legend .chip.confirmed { background: var(--confirmed-bg); color: var(--confirmed-text); }
  .legend .chip.suggested { background: var(--suggested-bg); color: var(--suggested-text); }
  .legend .chip.blank     { background: var(--blank-bg);     color: var(--blank-text); }

  main {
    max-width: 1400px;
    margin: 0 auto;
  }
  .priority-section {
    margin-bottom: 26px;
  }
  .priority-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 2px solid var(--accent);
  }
  .priority-header h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.25;
  }
  .priority-header-text { flex: 1; min-width: 0; }
  .priority-workload {
    margin-top: 2px;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.3;
  }
  .priority-tag {
    flex: 0 0 auto;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    background: #eef2f5;
    color: #4a5568;
    letter-spacing: 0.05em;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
  }
  @media (max-width: 900px) {
    .row { grid-template-columns: 1fr; }
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    box-shadow: var(--shadow);
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: none;
  }
  .badge.confirmed { background: var(--confirmed-bg); color: var(--confirmed-text); }
  .badge.suggested { background: var(--suggested-bg); color: var(--suggested-text); }
  .badge.blank     { background: var(--blank-bg);     color: var(--blank-text); }

  .card-body {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .icon-wrap {
    flex: 0 0 72px;
    width: 72px;
    text-align: center;
  }
  .icon-wrap img {
    width: 72px;
    height: auto;
    border-radius: 6px;
    background: #fafafa;
    border: 1px solid var(--border);
    object-fit: contain;
    display: block;
  }
  .icon-fallback {
    width: 72px;
    height: 72px;
    border: 1px dashed #c8c8c8;
    border-radius: 6px;
    display: none;
    align-items: center;
    justify-content: center;
    color: #999;
    font-size: 11px;
    text-align: center;
    padding: 4px;
    background: #fafafa;
    box-sizing: border-box;
    line-height: 1.3;
  }
  .icon-fallback.pending {
    border-color: #e0c270;
    background: #fffaf0;
    color: #8a5a00;
  }
.icon-file {
    margin-top: 6px;
    font-size: 10.5px;
    color: var(--muted);
    word-break: break-all;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  .card-content {
    flex: 1;
    min-width: 0;
  }
  .cta-label {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 2px;
  }
  .card-title {
    font-size: 14px;
    font-weight: 700;
    margin: 0 0 3px 0;
    color: var(--text);
  }
  .card-snippet {
    font-size: 12.5px;
    color: var(--muted);
    margin: 0 0 6px 0;
    line-height: 1.35;
  }
  .card-link {
    font-size: 12px;
    color: var(--accent);
    font-weight: 600;
    text-decoration: none;
    border: 1px solid var(--accent);
    padding: 4px 10px;
    border-radius: 6px;
    display: inline-block;
    transition: background 0.15s ease;
  }
  .card-link:hover {
    background: var(--accent);
    color: #fff;
  }
  .card-link.disabled {
    color: #aaa;
    border-color: #ddd;
    pointer-events: none;
  }
  .url-fallback {
    font-size: 10px;
    color: var(--muted);
    word-break: break-all;
    margin-top: 6px;
    display: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
</style>
</head>
<body>
<header>
  <div class="header-top">
    <h1>TRAIL Kits : Industry CTA and icon mapping</h1>
    <div class="download-group">
      <button id="downloadBtn" class="download-btn" type="button">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v10M4 8l4 4 4-4M2 14h12"/></svg>
        Download JSON
      </button>
      <button id="downloadCsvBtn" class="download-btn download-btn-alt" type="button">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v10M4 8l4 4 4-4M2 14h12"/></svg>
        Download CSV
      </button>
    </div>
  </div>
</header>

<main id="dashboard"></main>

<script>
let DATA = [];

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// These icon filenames return 302 → /?mktfail on NVIDIA's Marketo CDN
// (asset not yet uploaded). Render a clean placeholder instead of attempting
// the broken request.
const MISSING_FROM_CDN = new Set([]);

function renderCard(priority, cta) {
  const statusKey = (cta.status || "Blank").toLowerCase();
  const hasIcon = !!cta.icon_url;
  const hasLink = !!cta.link;
  const iconPending = hasIcon && MISSING_FROM_CDN.has(cta.icon_file);

  let iconBlock;
  if (!hasIcon) {
    iconBlock = `<div class="icon-fallback" style="display:flex;">No icon</div>`;
  } else if (iconPending) {
    iconBlock = `
      <div class="icon-fallback pending" style="display:flex;">Icon pending<br/>on CDN</div>
      <div class="url-fallback" style="display:block;">${escapeHtml(cta.icon_url)}</div>
    `;
  } else {
    iconBlock = `
      <img src="${escapeHtml(cta.icon_url)}" alt="${escapeHtml(cta.icon_file)}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'; const u=this.parentElement.querySelector('.url-fallback'); if(u) u.style.display='block';" />
      <div class="icon-fallback">Image failed to load</div>
      <div class="url-fallback">${escapeHtml(cta.icon_url)}</div>
    `;
  }

  return `
    <div class="card">
      <div class="card-body">
        <div class="icon-wrap">
          ${iconBlock}
        </div>
        <div class="card-content">
          <div class="cta-label">${escapeHtml(cta.label || "")}</div>
          <h3 class="card-title">${escapeHtml(cta.title)}</h3>
          <p class="card-snippet">${escapeHtml(cta.snippet)}</p>
          ${hasLink
            ? `<a class="card-link" href="${escapeHtml(cta.link)}" target="_blank" rel="noopener noreferrer">CTA here →</a>`
            : `<span class="card-link disabled">No link</span>`}
        </div>
      </div>
    </div>
  `;
}

function renderSection(section) {
  const cards = section.ctas.map(c => renderCard(section.priority, c)).join("");
  const industry = section.industry || "";
  const workload = section.workload || "";
  return `
    <section class="priority-section">
      <div class="priority-header">
        <div class="priority-header-text">
          <h2>${escapeHtml(industry)}</h2>
          <div class="priority-workload">${escapeHtml(workload)}</div>
        </div>
        <span class="priority-tag">${escapeHtml(section.priority)}</span>
      </div>
      <div class="row">${cards}</div>
    </section>
  `;
}

async function loadAndRender() {
  try {
    const res = await fetch("database.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status} while fetching database.json`);
    DATA = await res.json();
    document.getElementById("dashboard").innerHTML = DATA.map(renderSection).join("");
  } catch (err) {
    document.getElementById("dashboard").innerHTML =
      `<div style="padding:24px;border:1px solid #f7c0c0;background:#fff5f5;color:#8a2c2c;border-radius:8px;font-size:14px;">
        Could not load <code>database.json</code> from the same folder as this dashboard.<br/>
        <small>${err.message}</small><br/><br/>
        If you opened the HTML by double-clicking the file, your browser may be blocking <code>fetch()</code> from <code>file://</code>.
        Start a local server in this folder and reopen:<br/>
        <code style="display:inline-block;margin-top:6px;padding:4px 8px;background:#fff;border-radius:4px;">python3 -m http.server 8000</code>
      </div>`;
  }
}
loadAndRender();

// ---- Download JSON ----
document.getElementById("downloadBtn").addEventListener("click", () => {
  const payload = {
    generated: new Date().toISOString(),
    sections: DATA.map(section => ({
      priority: section.priority,
      industry: section.industry || "",
      workload: section.workload || "",
      ctas: section.ctas.map((c, i) => ({
        cta: `CTA ${i + 1}`,
        code: c.code || `tk_s${section.priority.replace(/\D/g,"")}_c${i+1}_0626.png`,
        title: c.title,
        tagline: c.snippet || "",
        link: c.link || null,
        icon_file: c.icon_file || null
      }))
    }))
  };
  const json = JSON.stringify(payload, null, 2);
  const blob = new Blob([json], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `cta-icon-mapping-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// ---- Download CSV ----
document.getElementById("downloadCsvBtn").addEventListener("click", () => {
  const escapeCsv = (v) => {
    const s = String(v ?? "");
    return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
  };
  const header = ["priority", "cta", "png_name", "image_used"];
  const rows = [header.join(",")];
  for (const section of DATA) {
    const prio = section.priority || "";
    const prioNum = (prio.match(/\d+/) || ["?"])[0];
    section.ctas.forEach((c, i) => {
      const code = c.code || `tk_s${prioNum}_c${i+1}_0626.png`;
      rows.push([
        escapeCsv(prio),
        escapeCsv(`CTA ${i + 1}`),
        escapeCsv(code),
        escapeCsv(c.icon_file || "")
      ].join(","));
    });
  }
  const csv = rows.join("\n") + "\n";
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0, 10);
  a.href = url;
  a.download = `cta-icon-mapping-${stamp}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});
</script>
</body>
</html>
